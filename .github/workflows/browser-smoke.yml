name: browser-smoke

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static and JavaScript checks
        run: |
          test -f index.html
          test -s vendor/three.min.js
          grep -q './vendor/three.min.js' index.html
          ! grep -q 'type="module"' index.html
          ! grep -q 'three.module.js' index.html
          ! grep -Eq 'from[[:space:]]+["'"'"']three["'"'"']' index.html
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('No inline application script found');
          new Function(scripts[scripts.length - 1]);
          console.log('Inline JavaScript parses successfully');
          NODE

      - name: Browser runtime check
        run: |
          python3 -m http.server 4173 > /tmp/poselab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:4173/index.html > /dev/null

          for entry in \
            "file://${GITHUB_WORKSPACE}/index.html" \
            "http://127.0.0.1:4173/index.html"
          do
            out="$(mktemp)"
            timeout 20s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
              --use-gl=angle --use-angle=swiftshader --virtual-time-budget=3000 \
              --dump-dom "$entry" > "$out"

            grep -q 'id="status" class="status ready"' "$out" || {
              echo "Application did not reach Ready for $entry"
              cat /tmp/poselab-server.log
              tail -n 80 "$out"
              exit 1
            }
            rm -f "$out"
          done
