name: browser-smoke

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static JavaScript checks
        run: |
          test -s vendor/three.module.js
          test -s vendor/OrbitControls.js
          ! test -e vendor/three.min.js
          grep -q './vendor/three.module.js' index.html
          grep -q './vendor/OrbitControls.js' index.html
          ! grep -Eq "from[[:space:]]+['\"]three['\"]" index.html
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('No application script found');
          const app = scripts[scripts.length - 1].replace(/^import[^;]+;\s*/gm, '');
          new Function(app);
          console.log('Application JavaScript parses successfully');
          NODE

      - name: Install browser test runner
        run: npm install --no-save playwright-core@1.52.0

      - name: Browser runtime check
        run: |
          BROWSER_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_PATH"
          export BROWSER_PATH
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 > /tmp/poselab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node <<'NODE'
          const { chromium } = require('playwright-core');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox', '--enable-webgl', '--ignore-gpu-blocklist', '--enable-unsafe-swiftshader', '--use-gl=angle', '--use-angle=swiftshader']
            });
            const errors = [];

            for (const url of [
              `file://${process.env.GITHUB_WORKSPACE}/index.html`,
              'http://127.0.0.1:4173/index.html'
            ]) {
              const page = await browser.newPage();
              page.on('pageerror', error => errors.push(`${url} pageerror: ${error.message}`));
              page.on('console', msg => {
                if (msg.type() === 'error') errors.push(`${url} console: ${msg.text()}`);
              });

              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForTimeout(1000);
                await page.waitForSelector('#status.ready', { state: 'visible', timeout: 15000 });

                for (const selector of ['#random', '#save', '#reset', '#shuffle', '[data-preset="A-Pose"]']) {
                  await page.click(selector);
                }
                await page.click('[data-model="female"]');
                await page.click('[data-model="child"]');
                await page.click('[data-model="basic"]');
                await page.selectOption('#prop', 'ball');
                await page.selectOption('#prop', 'none');
                await page.click('#share').catch(() => {});
              } catch (error) {
                let snapshot;
                try {
                  snapshot = await page.evaluate(() => ({
                    status: document.querySelector('#status')?.textContent || 'missing',
                    statusClass: document.querySelector('#status')?.className || 'missing',
                    bodyText: document.body.innerText.slice(0, 500),
                    canvasCount: document.querySelectorAll('canvas').length
                  }));
                } catch {
                  snapshot = { status: 'evaluate failed' };
                }
                errors.push(`${url} readiness: ${error.message}; ${JSON.stringify(snapshot)}`);
              } finally {
                await page.close();
              }
            }

            await browser.close();
            if (errors.length) throw new Error(errors.join('\n'));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
