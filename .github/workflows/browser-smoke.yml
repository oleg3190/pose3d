name: browser-smoke

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.52.0
      - name: Locate browser
        run: |
          BROWSER_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Test file:// and HTTP runtime
        run: |
          python3 -m http.server 4173 > /tmp/poselab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node <<'NODE'
          const { chromium } = require('playwright-core');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox', '--use-gl=angle', '--use-angle=swiftshader']
            });
            const errors = [];

            for (const url of [
              `file://${process.env.GITHUB_WORKSPACE}/index.html`,
              'http://127.0.0.1:4173/index.html'
            ]) {
              const page = await browser.newPage();
              page.on('pageerror', error => errors.push(`${url} pageerror: ${error.message}`));
              page.on('console', msg => {
                if (msg.type() === 'error') errors.push(`${url} console: ${msg.text()}`);
              });

              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
                await page.waitForSelector('#status.ready', { state: 'visible', timeout: 15000 });
                await page.click('#random');
                await page.click('#save');
                await page.click('#reset');
                await page.waitForSelector('#status.ready', { state: 'visible', timeout: 5000 });
              } catch (error) {
                const status = await page.locator('#status').textContent().catch(() => 'unavailable');
                errors.push(`${url} readiness: ${error.message}; status=${status}`);
              } finally {
                await page.close();
              }
            }

            await browser.close();

            if (errors.length) {
              throw new Error(errors.join("\n"));
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
