name: browser-smoke

on:
  push:
  pull_request:

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static JavaScript checks
        run: |
          test -s vendor/three-legacy.min.js
          test -s vendor/OrbitControls.js
          ! test -e vendor/three.module.js
          grep -q './vendor/three-legacy.min.js' index.html
          grep -q './vendor/OrbitControls.js' index.html
          grep -Eq 'globalThis\.OrbitControls[[:space:]]*=[[:space:]]*OrbitControls' vendor/OrbitControls.js
          ! grep -Eq "from[[:space:]]+['\"]three['\"]" index.html
          grep -q 'getContext("webgl",' index.html
          grep -q 'webgl1' index.html
          ! grep -q 'WebGL2 requires' index.html
          ! grep -q 'WebGL 1 support was deprecated' vendor/three-legacy.min.js
          ! grep -q 'children\[2\]' index.html
          grep -q 'runRegressionChecks' index.html
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('No application script found');
          const app = scripts[scripts.length - 1].replace(/^import[^;]+;\s*/gm, '');
          new Function(app);
          console.log('Application JavaScript parses successfully');
          NODE

      - name: Verify local server script
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/occupied-port.log 2>&1 &
          OCCUPIED_PID=$!
          trap 'kill $OCCUPIED_PID 2>/dev/null || true' EXIT
          sleep 1
          test -x ./serve.sh
          set +e
          output="$(timeout 3s ./serve.sh)"
          exit_code=$?
          set -e
          test "$exit_code" -eq 124
          printf '%s\n' "$output"
          echo "$output" | grep -q 'http://127.0.0.1:4174/'

      - name: Browser WebGL1 renderer smoke test
        run: |
          mkdir -p .ci-runtime
          cat > .ci-runtime/webgl1.html <<'HTML'
          <!doctype html>
          <html><body>
          <div id="status">Loading</div>
          <script src="../vendor/three-legacy.min.js"></script>
          <script>
          try {
            const canvas = document.createElement("canvas");
            const gl = canvas.getContext("webgl", { failIfMajorPerformanceCaveat: false }) ||
              canvas.getContext("experimental-webgl", { failIfMajorPerformanceCaveat: false });
            if (!gl) throw new Error("WebGL1 unavailable in headless environment");
            const renderer = new THREE.WebGLRenderer({ canvas, context: gl });
            renderer.dispose();
            document.querySelector("#status").textContent = "Ready";
            document.querySelector("#status").className = "ready";
          } catch (err) {
            document.querySelector("#status").textContent = "Error: " + (err.message || err);
            document.querySelector("#status").className = "error";
          }
          </script>
          </body></html>
          HTML

          python3 -m http.server 4173 > /tmp/poselab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1

          out="$(mktemp)"
          timeout 30s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader \
            --use-gl=angle --use-angle=swiftshader --virtual-time-budget=3000 \
            --dump-dom http://127.0.0.1:4173/.ci-runtime/webgl1.html > "$out"

          grep -q 'id="status" class="ready"' "$out"
          grep -q 'Ready' "$out"
          echo "Three.js WebGL1 renderer smoke test passed."
          rm -f "$out"


      - name: Browser mannequin regression test
        run: |
          python3 -m http.server 4173 > /tmp/poselab-regression-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1

          out="$(mktemp)"
          timeout 20s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader \
            --use-gl=angle --use-angle=swiftshader --virtual-time-budget=15000 \
            --dump-dom "http://127.0.0.1:4173/index.html?smoke=1" > "$out"

          grep -o 'id="status"[^>]*>[^<]*' "$out" || true
          ! grep -q 'Runtime error:' "$out"
          grep -q 'id="status" class="status ready"' "$out"
          echo "All mannequin models, joints, presets, random pose and state restore passed."
          rm -f "$out"
